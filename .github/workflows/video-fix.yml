name: Video upload fix APK

on:
  push:
    branches: ['fix/video-upload-v3.1.1']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-android-native
      - name: Use official Gradle distribution
        run: sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
      - name: Test AI module
        run: ./gradlew :ai:testDebugUnitTest -Prikkahub.forkBuild=true --stacktrace
      - name: Build independent debug APK
        run: ./gradlew :app:assembleDebug -Prikkahub.forkBuild=true --stacktrace
      - name: Upload APK and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huadeng-3.1.1-video-fix-arm64
          path: |
            app/build/outputs/apk/debug/*.apk
            ai/build/test-results/testDebugUnitTest/
            ai/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 14
